name: pos_app
description: POS Background Upload/Download Module - Flutter app for file transfer management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.3+1
  file_picker: ^8.0.3
  flutter_local_notifications: ^17.2.1
  flutter_foreground_task: ^8.9.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  open_filex: ^4.4.0
  media_store_plus: ^0.1.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
